<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AfriRisk Auto — Tarification</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent-dim: #16a34a;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem 1rem 4rem;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  header p { color: var(--muted); margin: 0; font-size: 0.9rem; }
  nav a { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  nav a:hover { color: var(--text); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  .panel h2 { font-size: 1rem; margin: 0 0 1rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.9rem 0 0.3rem; }
  input, select {
    width: 100%;
    padding: 0.55rem 0.65rem;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
  }
  button {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.75rem;
    background: var(--accent);
    color: #062a10;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dim); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .result-line { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem; }
  .result-line:last-child { border-bottom: none; }
  .result-line .label { color: var(--muted); }
  .total {
    margin-top: 1rem;
    padding: 1rem;
    background: #0b1220;
    border-radius: 8px;
    text-align: center;
  }
  .total .amount { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .total .amount-label { font-size: 0.8rem; color: var(--muted); }
  .contrib { margin-top: 1rem; }
  .contrib-row { display: flex; justify-content: space-between; font-size: 0.82rem; padding: 0.25rem 0; }
  .contrib-row .up { color: #f87171; }
  .contrib-row .down { color: #4ade80; }
  .badge {
    display: inline-block;
    margin-top: 0.75rem;
    padding: 0.35rem 0.6rem;
    border-radius: 6px;
    font-size: 0.78rem;
  }
  .badge.ok { background: rgba(34,197,94,0.15); color: var(--accent); border: 1px solid rgba(34,197,94,0.3); }
  .badge.warn { background: rgba(245,158,11,0.15); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }
  .placeholder { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 2rem 0; }
  .error { color: #f87171; font-size: 0.85rem; margin-top: 0.75rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AfriRisk Auto — Nouvelle tarification</h1>
    <p>MVP · République Centrafricaine · modèle calibré sur portefeuille synthétique</p>
    <nav><a href="/app/dashboard.html">Voir le tableau de bord portefeuille →</a></nav>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>Contrat</h2>
      <form id="quote-form">
        <label for="age_conducteur">Âge du conducteur</label>
        <input type="number" id="age_conducteur" min="18" max="90" value="32" required />

        <label for="anciennete_permis">Ancienneté du permis (années)</label>
        <input type="number" id="anciennete_permis" min="0" max="72" value="10" required />

        <label for="usage">Usage</label>
        <select id="usage">
          <option value="particulier" selected>Particulier</option>
          <option value="professionnel">Professionnel</option>
        </select>

        <label for="zone">Zone géographique</label>
        <select id="zone">
          <option value="bangui" selected>Bangui</option>
          <option value="province">Province</option>
        </select>

        <label for="puissance_cv">Puissance fiscale (CV)</label>
        <input type="number" id="puissance_cv" min="1" max="60" value="9" required />

        <label for="valeur_vehicule_fcfa">Valeur du véhicule (FCFA)</label>
        <input type="number" id="valeur_vehicule_fcfa" min="1" step="1000" value="8500000" required />

        <label for="garantie">Garantie</label>
        <select id="garantie">
          <option value="tiers_simple">RC obligatoire (tiers simple)</option>
          <option value="tiers_etendu">Tiers étendu</option>
          <option value="tous_risques">Tous risques</option>
        </select>

        <label for="nb_sinistres_anterieurs">Sinistres antérieurs</label>
        <input type="number" id="nb_sinistres_anterieurs" min="0" max="20" value="0" required />

        <button type="submit" id="submit-btn">Calculer la prime</button>
      </form>
      <div class="error" id="error" hidden></div>
    </div>

    <div class="panel">
      <h2>Résultat</h2>
      <div id="result">
        <div class="placeholder">Renseigne le contrat et calcule pour voir la prime estimée.</div>
      </div>
    </div>
  </div>
</div>

<script>
const form = document.getElementById('quote-form');
const resultEl = document.getElementById('result');
const errorEl = document.getElementById('error');
const submitBtn = document.getElementById('submit-btn');

const fmt = (n) => Math.round(n).toLocaleString('fr-FR');

function contribRows(contributions) {
  return Object.entries(contributions)
    .sort((a, b) => Math.abs(b[1] - 1) - Math.abs(a[1] - 1))
    .map(([name, factor]) => {
      const pct = (factor - 1) * 100;
      const cls = pct >= 0 ? 'up' : 'down';
      const sign = pct >= 0 ? '+' : '';
      return `<div class="contrib-row"><span>${name}</span><span class="${cls}">${sign}${pct.toFixed(1)}%</span></div>`;
    })
    .join('');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Calcul en cours…';

  const payload = {
    age_conducteur: Number(document.getElementById('age_conducteur').value),
    anciennete_permis: Number(document.getElementById('anciennete_permis').value),
    usage: document.getElementById('usage').value,
    zone: document.getElementById('zone').value,
    puissance_cv: Number(document.getElementById('puissance_cv').value),
    valeur_vehicule_fcfa: Number(document.getElementById('valeur_vehicule_fcfa').value),
    garantie: document.getElementById('garantie').value,
    nb_sinistres_anterieurs: Number(document.getElementById('nb_sinistres_anterieurs').value),
  };

  try {
    const res = await fetch('/tarif', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const detail = await res.json().catch(() => null);
      throw new Error(detail?.detail ? JSON.stringify(detail.detail) : `Erreur API (${res.status})`);
    }
    const data = await res.json();

    const badgeClass = data.regulatory_check.compliant ? 'ok' : 'warn';
    const badgeText = data.regulatory_check.compliant ? '✓ Conforme (contrôle réglementaire)' : '⚠ ' + data.regulatory_check.message;

    resultEl.innerHTML = `
      <div class="result-line"><span class="label">Fréquence estimée</span><span>${(data.frequence_estimee * 100).toFixed(1)} %</span></div>
      <div class="result-line"><span class="label">Coût moyen estimé</span><span>${fmt(data.cout_moyen_estime)} FCFA</span></div>
      <div class="result-line"><span class="label">Prime pure</span><span>${fmt(data.prime_pure)} FCFA</span></div>
      <div class="result-line"><span class="label">Frais de gestion</span><span>${fmt(data.frais_gestion)} FCFA</span></div>
      <div class="result-line"><span class="label">Marge technique</span><span>${fmt(data.marge_technique)} FCFA</span></div>
      <div class="result-line"><span class="label">Taxes</span><span>${fmt(data.taxes)} FCFA</span></div>
      <div class="total">
        <div class="amount-label">PRIME COMMERCIALE ANNUELLE</div>
        <div class="amount">${fmt(data.prime_commerciale)} FCFA</div>
      </div>
      <span class="badge ${badgeClass}">${badgeText}</span>
      <div class="contrib">
        <h2 style="margin-top:1.25rem">Facteurs de fréquence</h2>
        ${contribRows(data.frequence_contributions)}
        <h2 style="margin-top:1.25rem">Facteurs de sévérité</h2>
        ${contribRows(data.severite_contributions)}
      </div>
    `;
  } catch (err) {
    errorEl.textContent = err.message || 'Erreur inattendue.';
    errorEl.hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Calculer la prime';
  }
});
</script>
</body>
</html>
