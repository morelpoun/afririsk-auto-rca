services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afririsk
      POSTGRES_PASSWORD: afririsk
      POSTGRES_DB: afririsk
    ports:
      - "5432:5432"
    volumes:
      - afririsk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afririsk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://afririsk:afririsk@db:5432/afririsk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  afririsk-db:
